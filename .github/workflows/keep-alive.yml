# Render's free plan puts the API to sleep after 15 minutes without traffic, and waking it takes minutes,
# longer than Vercel waits for /api. Calling the health check every 10 minutes keeps it awake.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the API health check
        run: |
          curl --fail --silent --show-error --max-time 300 --retry 3 --retry-delay 20 --retry-all-errors \
            https://ett-hr-api.onrender.com/actuator/health/readiness
